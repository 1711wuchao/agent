server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:119.29.163.90}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:contract_agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:contract_user}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

contract:
  template-root: ${CONTRACT_TEMPLATE_ROOT:../templates}
  output-root: ${CONTRACT_OUTPUT_ROOT:./storage/contracts}
  vector-store: chroma
  chroma:
    url: ${CHROMA_URL:http://localhost:8000}
    collection: ${CHROMA_COLLECTION:contract_knowledge_v1}

agent:
  tool-token: ${AGENT_TOOL_TOKEN:}

kimi:
  api-base: ${KIMI_API_BASE:https://api.moonshot.cn/v1}
  api-key: ${KIMI_API_KEY:}
  model: ${KIMI_MODEL:moonshot-v1-8k}
  timeout-ms: ${KIMI_TIMEOUT_MS:30000}
