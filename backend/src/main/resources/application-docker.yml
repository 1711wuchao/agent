server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:contract_agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:contract_user}
    password: ${MYSQL_PASSWORD:contract_password}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

contract:
  template-root: ${CONTRACT_TEMPLATE_ROOT:/app/templates}
  output-root: ${CONTRACT_OUTPUT_ROOT:/app/storage/contracts}
  vector-store: chroma
  chroma:
    url: ${CHROMA_URL:http://chroma:8000}
